<!DOCTYPE html>
<html>
<head>
  <title>Player Trails Visualization</title>
  <style>
    body { 
      font-family: sans-serif; 
      padding: 2rem;
      background: #f5f5f5;
    }
    h1 { 
      color: #333;
      margin-bottom: 1.5rem;
    }
    .trail-container {
      display: flex;
      flex-direction: column;
      gap: 20px;
      margin-bottom: 30px;
    }
    .trail-card {
      background: white;
      border-radius: 8px;
      padding: 20px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }
    .trail-info {
      margin-bottom: 15px;
      display: flex;
      justify-content: space-between;
    }
    .trail-meta {
      color: #666;
      font-size: 0.9rem;
    }
    .canvas-container {
      position: relative;
      width: 100%;
      height: 400px;
      border: 1px solid #ddd;
      margin-top: 10px;
      overflow: hidden;
    }
    canvas {
      background: #f0f0f0;
    }
    .trail-actions {
      margin-top: 15px;
      display: flex;
      gap: 10px;
    }
    button {
      padding: 8px 16px;
      background: #4CAF50;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }
    button:hover {
      background: #45a049;
    }
    #controls {
      margin-bottom: 20px;
      padding: 15px;
      background: white;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }
    .refresh-btn {
      background: #2196F3;
    }
    .refresh-btn:hover {
      background: #0b7dda;
    }
    .clear-btn {
      background: #f44336;
    }
    .clear-btn:hover {
      background: #d32f2f;
    }
    .trail-stats {
      font-size: 0.9rem;
      color: #555;
      margin-top: 10px;
    }
    .no-data {
      padding: 30px;
      text-align: center;
      background: white;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      color: #666;
    }
    .card {
      background: white;
      border-radius: 8px;
      padding: 20px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      margin-bottom: 30px;
    }
    h2 {
      color: #333;
      margin-top: 0;
      margin-bottom: 10px;
    }
    .subtitle {
      color: #666;
      margin-top: 0;
      margin-bottom: 20px;
      font-size: 0.9rem;
    }
    .heatmap-container {
      width: 100%;
      height: 500px;
      border: 1px solid #ddd;
      border-radius: 4px;
      overflow: hidden;
      position: relative;
    }
    #heatmapCanvas {
      background: #f5f5f5;
      width: 100%;
      height: 100%;
    }
    .heatmap-controls {
      display: flex;
      flex-wrap: wrap;
      gap: 20px;
      margin-bottom: 20px;
      padding: 15px;
      background: #f9f9f9;
      border-radius: 8px;
      border: 1px solid #eee;
    }
    .control-group {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .control-group label {
      font-weight: 500;
      color: #555;
      min-width: 100px;
    }
    .control-group input[type="range"] {
      width: 150px;
    }
    .control-group span {
      min-width: 60px;
      text-align: center;
      font-size: 0.9rem;
      color: #666;
    }
  </style>
</head>
<body>
  <h1>Player Trails Visualization</h1>
  
  <div id="controls">
    <button id="refreshBtn" class="refresh-btn">Refresh Data</button>
    <button id="clearBtn" class="clear-btn">Clear All Trails</button>
  </div>
  
  <div class="card">
    <h2>Activity Heatmap</h2>
    <p class="subtitle">Combined activity from all trails</p>
    
    <div class="heatmap-controls">
      <div class="control-group">
        <label for="gridSizeSlider">Grid Size:</label>
        <input type="range" id="gridSizeSlider" min="10" max="100" step="5" value="30">
        <span id="gridSizeValue">30 x 30</span>
      </div>
      
      <div class="control-group">
        <label for="intensitySlider">Heat Intensity:</label>
        <input type="range" id="intensitySlider" min="0.1" max="2" step="0.1" value="1">
        <span id="intensityValue">1.0</span>
      </div>
      
      <div class="control-group">
        <label for="blurSlider">Blur Amount:</label>
        <input type="range" id="blurSlider" min="0" max="20" step="1" value="5">
        <span id="blurValue">5px</span>
      </div>
    </div>
    
    <div id="heatmapContainer" class="heatmap-container">
      <canvas id="heatmapCanvas" width="800" height="500"></canvas>
    </div>
  </div>
  
  <h2>Individual Trails</h2>
  <div id="trailsContainer" class="trail-container">
    <div class="no-data">No trail data available. Send data to the /player-trail endpoint to visualize.</div>
  </div>
  
  <script>
    // Declare global storage for trail data
    let lastTrailsData = [];
    
    // Fetch trails data
    async function fetchTrails() {
      try {
        const response = await fetch('/api/trails');
        return await response.json();
      } catch (error) {
        console.error('Error fetching trails:', error);
        return { trails: [] };
      }
    }
    
    // Clear all trails
    async function clearTrails() {
      try {
        await fetch('/api/trails/clear', { method: 'POST' });
        renderTrails([]);
      } catch (error) {
        console.error('Error clearing trails:', error);
      }
    }
    
    // Render a single trail visualization
    function renderTrailCanvas(canvas, positionHistory) {
      const ctx = canvas.getContext('2d');
      const width = canvas.width;
      const height = canvas.height;
      
      // Clear canvas
      ctx.clearRect(0, 0, width, height);
      
      if (!positionHistory || positionHistory.length === 0) {
        ctx.fillStyle = '#ccc';
        ctx.font = '16px Arial';
        ctx.textAlign = 'center';
        ctx.fillText('No position data', width/2, height/2);
        return;
      }
      
      // Find min/max coordinates to create bounds
      let minX = Infinity, minZ = Infinity;
      let maxX = -Infinity, maxZ = -Infinity;
      
      positionHistory.forEach(pos => {
        minX = Math.min(minX, Number(pos.x));
        maxX = Math.max(maxX, Number(pos.x));
        minZ = Math.min(minZ, Number(pos.z));
        maxZ = Math.max(maxZ, Number(pos.z));
      });
      
      // Add padding
      const padding = 20;
      const rangeX = maxX - minX || 1;
      const rangeZ = maxZ - minZ || 1;
      
      // Scale and render the path
      ctx.beginPath();
      
      positionHistory.forEach((pos, index) => {
        const x = padding + ((Number(pos.x) - minX) / rangeX) * (width - padding * 2);
        const y = padding + ((Number(pos.z) - minZ) / rangeZ) * (height - padding * 2);
        
        if (index === 0) {
          ctx.moveTo(x, y);
        } else {
          ctx.lineTo(x, y);
        }
      });
      
      // Style for the path
      ctx.strokeStyle = '#2196F3';
      ctx.lineWidth = 2;
      ctx.stroke();
      
      // Mark the start point
      const startX = padding + ((Number(positionHistory[0].x) - minX) / rangeX) * (width - padding * 2);
      const startY = padding + ((Number(positionHistory[0].z) - minZ) / rangeZ) * (height - padding * 2);
      ctx.fillStyle = 'green';
      ctx.beginPath();
      ctx.arc(startX, startY, 5, 0, 2 * Math.PI);
      ctx.fill();
      
      // Mark the end point
      const endX = padding + ((Number(positionHistory[positionHistory.length-1].x) - minX) / rangeX) * (width - padding * 2);
      const endY = padding + ((Number(positionHistory[positionHistory.length-1].z) - minZ) / rangeZ) * (height - padding * 2);
      ctx.fillStyle = 'red';
      ctx.beginPath();
      ctx.arc(endX, endY, 5, 0, 2 * Math.PI);
      ctx.fill();
    }
    
    // Render all trails
    function renderTrails(trails) {
      const container = document.getElementById('trailsContainer');
      
      if (!trails || trails.length === 0) {
        container.innerHTML = '<div class="no-data">No trail data available. Send data to the /player-trail endpoint to visualize.</div>';
        return;
      }
      
      // Clear container
      container.innerHTML = '';
      
      // Create a card for each trail
      trails.forEach((trail, index) => {
        const timestamp = trail.userInfo?.timestamp || 'Unknown time';
        const userId = trail.userInfo?.id || 'Unknown user';
        const positions = trail.positionHistory || [];
        
        const trailCard = document.createElement('div');
        trailCard.className = 'trail-card';
        
        // Create header with trail info
        const trailInfo = document.createElement('div');
        trailInfo.className = 'trail-info';
        
        const title = document.createElement('h3');
        title.textContent = 'Trail #' + (index + 1);
        trailInfo.appendChild(title);
        
        const meta = document.createElement('div');
        meta.className = 'trail-meta';
        
        const userDiv = document.createElement('div');
        userDiv.textContent = 'User: ' + userId;
        meta.appendChild(userDiv);
        
        const timeDiv = document.createElement('div');
        timeDiv.textContent = 'Time: ' + timestamp;
        meta.appendChild(timeDiv);
        
        trailInfo.appendChild(meta);
        trailCard.appendChild(trailInfo);
        
        // Add stats
        const stats = document.createElement('div');
        stats.className = 'trail-stats';
        
        let statsText = 'Points: ' + positions.length;
        
        if (positions.length > 0) {
          statsText += ' | Start: (' + 
            (Number(positions[0].x).toFixed(2)) + ', ' + 
            (Number(positions[0].y).toFixed(2)) + ', ' + 
            (Number(positions[0].z).toFixed(2)) + ')';
            
          statsText += ' | End: (' + 
            (Number(positions[positions.length-1].x).toFixed(2)) + ', ' + 
            (Number(positions[positions.length-1].y).toFixed(2)) + ', ' + 
            (Number(positions[positions.length-1].z).toFixed(2)) + ')';
        }
        
        stats.textContent = statsText;
        trailCard.appendChild(stats);
        
        // Create canvas container and canvas
        const canvasContainer = document.createElement('div');
        canvasContainer.className = 'canvas-container';
        
        const canvas = document.createElement('canvas');
        canvas.width = canvasContainer.offsetWidth || 800;
        canvas.height = 400;
        canvasContainer.appendChild(canvas);
        trailCard.appendChild(canvasContainer);
        
        // Add to container
        container.appendChild(trailCard);
        
        // Render the trail on the canvas
        renderTrailCanvas(canvas, positions);
      });
    }
    
    // Render heatmap from all trails
    function renderHeatmap(trails) {
      const canvas = document.getElementById('heatmapCanvas');
      if (!canvas) return;
      
      const ctx = canvas.getContext('2d');
      if (!ctx) return;
      
      const width = canvas.width;
      const height = canvas.height;
      
      // Get parameters from UI
      const gridSizeSlider = document.getElementById('gridSizeSlider');
      const intensitySlider = document.getElementById('intensitySlider');
      const blurSlider = document.getElementById('blurSlider');
      
      if (!gridSizeSlider || !intensitySlider || !blurSlider) return;
      
      const gridSize = parseInt(gridSizeSlider.value);
      const intensityFactor = parseFloat(intensitySlider.value);
      const blurAmount = parseInt(blurSlider.value);
      
      // Update UI values
      const gridSizeValue = document.getElementById('gridSizeValue');
      const intensityValue = document.getElementById('intensityValue');
      const blurValue = document.getElementById('blurValue');
      
      if (gridSizeValue) gridSizeValue.textContent = gridSize + ' x ' + gridSize;
      if (intensityValue) intensityValue.textContent = intensityFactor.toFixed(1);
      if (blurValue) blurValue.textContent = blurAmount + 'px';
      
      // Clear canvas
      ctx.clearRect(0, 0, width, height);
      
      // Draw background
      ctx.fillStyle = '#f5f5f5';
      ctx.fillRect(0, 0, width, height);
      
      if (!trails || trails.length === 0) {
        ctx.fillStyle = '#999';
        ctx.font = '20px Arial';
        ctx.textAlign = 'center';
        ctx.fillText('No data available for heatmap', width/2, height/2);
        return;
      }
      
      // Collect all position points from all trails
      const allPoints = [];
      trails.forEach(trail => {
        if (trail.positionHistory && trail.positionHistory.length > 0) {
          trail.positionHistory.forEach(pos => {
            allPoints.push({
              x: Number(pos.x),
              z: Number(pos.z)
            });
          });
        }
      });
      
      if (allPoints.length === 0) {
        ctx.fillStyle = '#999';
        ctx.font = '20px Arial';
        ctx.textAlign = 'center';
        ctx.fillText('No position data available', width/2, height/2);
        return;
      }
      
      // Find bounds of all points
      let minX = Math.min(...allPoints.map(p => p.x));
      let maxX = Math.max(...allPoints.map(p => p.x));
      let minZ = Math.min(...allPoints.map(p => p.z));
      let maxZ = Math.max(...allPoints.map(p => p.z));
      
      // Add padding for axes
      const padding = 40;
      const rangeX = maxX - minX || 1;
      const rangeZ = maxZ - minZ || 1;
      
      // Create density grid for heatmap
      const cellWidth = (width - (padding * 2)) / gridSize;
      const cellHeight = (height - (padding * 2)) / gridSize;
      const densityGrid = Array(gridSize).fill().map(() => Array(gridSize).fill(0));
      
      // Populate density grid
      allPoints.forEach(point => {
        const normX = (point.x - minX) / rangeX;
        const normZ = (point.z - minZ) / rangeZ;
        
        const gridX = Math.floor(normX * (gridSize - 1));
        const gridZ = Math.floor(normZ * (gridSize - 1));
        
        if (gridX >= 0 && gridX < gridSize && gridZ >= 0 && gridZ < gridSize) {
          densityGrid[gridZ][gridX] += 1;
        }
      });
      
      // Find max density for normalization
      let maxDensity = 0;
      for (let z = 0; z < gridSize; z++) {
        for (let x = 0; x < gridSize; x++) {
          maxDensity = Math.max(maxDensity, densityGrid[z][x]);
        }
      }
      
      // Create an offscreen canvas for the heat layer
      const heatCanvas = document.createElement('canvas');
      heatCanvas.width = width;
      heatCanvas.height = height;
      const heatCtx = heatCanvas.getContext('2d');
      if (!heatCtx) return;
      
      // Draw heatmap cells
      for (let z = 0; z < gridSize; z++) {
        for (let x = 0; x < gridSize; x++) {
          const density = densityGrid[z][x];
          if (density > 0) {
            // Calculate intensity scaled by the intensity factor
            const intensity = Math.min(1, (density / maxDensity) * intensityFactor);
            
            // Calculate color based on intensity (from low heat to high heat)
            const r = Math.floor(255 * intensity);
            const g = Math.floor(70 * (1 - intensity));
            const b = Math.floor(30 * (1 - intensity));
            
            // Position on canvas (with padding)
            const x1 = padding + (x * cellWidth);
            const y1 = padding + (z * cellHeight);
            
            // Draw quantized cell
            heatCtx.fillStyle = `rgba(${r}, ${g}, ${b}, ${intensity})`;
            heatCtx.fillRect(x1, y1, cellWidth, cellHeight);
          }
        }
      }
      
      // Apply blur if needed
      if (blurAmount > 0) {
        heatCtx.globalAlpha = 0.6;
        heatCtx.filter = `blur(${blurAmount}px)`;
        heatCtx.drawImage(heatCanvas, 0, 0);
        heatCtx.filter = 'none';
        heatCtx.globalAlpha = 1.0;
      }
      
      // Draw the heat layer to the main canvas
      ctx.drawImage(heatCanvas, 0, 0);
      
      // Draw grid lines
      if (gridSize <= 50) { // Only draw grid lines if grid size is reasonable
        ctx.strokeStyle = 'rgba(150, 150, 150, 0.2)';
        ctx.lineWidth = 0.5;
        
        // Vertical grid lines
        for (let x = 0; x <= gridSize; x++) {
          const xPos = padding + (x * cellWidth);
          ctx.beginPath();
          ctx.moveTo(xPos, padding);
          ctx.lineTo(xPos, height - padding);
          ctx.stroke();
        }
        
        // Horizontal grid lines
        for (let z = 0; z <= gridSize; z++) {
          const yPos = padding + (z * cellHeight);
          ctx.beginPath();
          ctx.moveTo(padding, yPos);
          ctx.lineTo(width - padding, yPos);
          ctx.stroke();
        }
      }
      
      // Draw axes
      ctx.strokeStyle = '#999';
      ctx.lineWidth = 1;
      
      // Draw outer frame
      ctx.strokeRect(padding, padding, width - (padding * 2), height - (padding * 2));
      
      // Draw coordinate lines and labels
      ctx.setLineDash([5, 5]);
      
      // Horizontal lines
      for (let i = 0; i <= 5; i++) {
        const y = padding + (height - padding * 2) * (i / 5);
        ctx.beginPath();
        ctx.moveTo(padding, y);
        ctx.lineTo(width - padding, y);
        ctx.stroke();
        
        // Label
        const zValue = maxZ - (i / 5) * rangeZ;
        ctx.fillStyle = '#666';
        ctx.font = '12px Arial';
        ctx.textAlign = 'right';
        ctx.fillText(zValue.toFixed(1), padding - 5, y + 4);
      }
      
      // Vertical lines
      for (let i = 0; i <= 5; i++) {
        const x = padding + (width - padding * 2) * (i / 5);
        ctx.beginPath();
        ctx.moveTo(x, padding);
        ctx.lineTo(x, height - padding);
        ctx.stroke();
        
        // Label
        const xValue = minX + (i / 5) * rangeX;
        ctx.fillStyle = '#666';
        ctx.font = '12px Arial';
        ctx.textAlign = 'center';
        ctx.fillText(xValue.toFixed(1), x, height - padding + 15);
      }
      
      ctx.setLineDash([]);
      
      // Legend
      const legendWidth = 200;
      const legendHeight = 20;
      const legendX = width - legendWidth - 20;
      const legendY = 20;
      
      // Draw legend gradient
      const legendGradient = ctx.createLinearGradient(legendX, 0, legendX + legendWidth, 0);
      legendGradient.addColorStop(0, 'rgba(255, 70, 30, 0.1)');
      legendGradient.addColorStop(0.5, 'rgba(255, 40, 30, 0.6)');
      legendGradient.addColorStop(1, 'rgba(255, 0, 30, 1)');
      
      ctx.fillStyle = legendGradient;
      ctx.fillRect(legendX, legendY, legendWidth, legendHeight);
      
      // Draw legend border
      ctx.strokeStyle = '#999';
      ctx.lineWidth = 1;
      ctx.strokeRect(legendX, legendY, legendWidth, legendHeight);
      
      // Draw legend labels
      ctx.fillStyle = '#666';
      ctx.font = '12px Arial';
      ctx.textAlign = 'center';
      
      ctx.fillText('Low', legendX, legendY + legendHeight + 15);
      ctx.fillText('Medium', legendX + (legendWidth/2), legendY + legendHeight + 15);
      ctx.fillText('High', legendX + legendWidth, legendY + legendHeight + 15);
      
      // Draw stats
      ctx.fillStyle = '#333';
      ctx.font = '14px Arial';
      ctx.textAlign = 'left';
      ctx.fillText(`Total trails: ${trails.length}`, 20, 20);
      ctx.fillText(`Total points: ${allPoints.length}`, 20, 40);
      ctx.fillText(`Grid: ${gridSize}×${gridSize} cells`, 20, 60);
      ctx.fillText(`Hottest cell: ${maxDensity} visits`, 20, 80);
    }
    
    // Initial load
    async function loadTrails() {
      const data = await fetchTrails();
      
      // Save trails data for slider adjustments
      lastTrailsData = data.trails;
      
      renderTrails(data.trails);
      renderHeatmap(data.trails);
    }
    
    // Set up event listeners
    document.getElementById('refreshBtn')?.addEventListener('click', loadTrails);
    document.getElementById('clearBtn')?.addEventListener('click', clearTrails);
    
    // Heatmap control listeners
    document.getElementById('gridSizeSlider')?.addEventListener('input', () => {
      renderHeatmap(lastTrailsData || []);
    });
    
    document.getElementById('intensitySlider')?.addEventListener('input', () => {
      renderHeatmap(lastTrailsData || []);
    });
    
    document.getElementById('blurSlider')?.addEventListener('input', () => {
      renderHeatmap(lastTrailsData || []);
    });
    
    // Load trails on page load
    window.addEventListener('load', loadTrails);
    
    // Handle window resize for canvas
    window.addEventListener('resize', () => {
      // Resize heatmap canvas
      const heatmapCanvas = document.getElementById('heatmapCanvas');
      if (heatmapCanvas && heatmapCanvas.parentElement) {
        const heatmapContainer = heatmapCanvas.parentElement;
        heatmapCanvas.width = heatmapContainer.offsetWidth;
      }
      
      // Resize trail canvases
      const trailCanvases = document.querySelectorAll('.canvas-container canvas');
      trailCanvases.forEach(canvas => {
        const container = canvas.parentElement;
        if (container) {
          canvas.width = container.offsetWidth;
        }
      });
      
      // Re-render everything
      loadTrails();
    });
  </script>
</body>
</html>
